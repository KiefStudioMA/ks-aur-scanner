name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The default token only needs to read the repository.
permissions:
  contents: read

jobs:
  # Lint + the full test suite (unit AND the CLI integration tests that run the
  # real binary against the PKGBUILD fixtures). This is the gate that catches the
  # "passes unit tests but breaks when you run it" class of bug.
  test:
    name: clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests (unit + CLI integration)
        run: cargo test --locked --all --all-features

      - name: Release build
        run: cargo build --locked --all --release

  # The declared minimum supported Rust version (`rust-version` in Cargo.toml)
  # has to actually build. Without this job the README's MSRV drifts silently
  # every time code or a dependency starts using a newer toolchain feature.
  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --workspace --all-targets

  # Formatting is a hard gate. Applied repo-wide with `cargo fmt --all`.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # Catch toolchain regressions early without blocking PRs.
  beta:
    name: beta (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Deliberately NOT `-D warnings`, unlike every other job.
    #
    # This job exists to catch REAL breakage on the next toolchain: compile
    # errors, behaviour changes, test failures. New and tightened lints land in
    # beta constantly, and they frequently fire on macro-generated code we do
    # not own -- `clippy::double_must_use` fired inside `async_trait`'s own
    # expansion until async-trait 0.1.92 dropped the attribute, and the fix was
    # upstream's to make, not an `allow` on three of our traits.
    #
    # Inheriting the workflow-level `-D warnings` turned all of that into a red
    # X on every run. A job that is permanently red teaches everyone to ignore
    # it, so the one time beta catches something real, nobody looks. Warnings
    # still print in the log and are still worth reading; only genuine failures
    # colour the job.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all --all-features

  # Supply-chain gate: advisories, license policy, banned/duplicate crates, and
  # source allow-list. Runs in CI and on a weekly schedule (advisories land
  # after a PR merges, like RUSTSEC-2026-0007 in bytes did).
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
