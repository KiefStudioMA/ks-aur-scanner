name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The default token only needs to read the repository.
permissions:
  contents: read

jobs:
  # Lint + the full test suite (unit AND the CLI integration tests that run the
  # real binary against the PKGBUILD fixtures). This is the gate that catches the
  # "passes unit tests but breaks when you run it" class of bug.
  test:
    name: clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests (unit + CLI integration)
        run: cargo test --locked --all --all-features

      - name: Release build
        run: cargo build --locked --all --release

  # The declared minimum supported Rust version (`rust-version` in Cargo.toml)
  # has to actually build. Without this job the README's MSRV drifts silently
  # every time code or a dependency starts using a newer toolchain feature.
  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --workspace --all-targets

  # Formatting is a hard gate. Applied repo-wide with `cargo fmt --all`.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # Catch toolchain regressions early without blocking PRs.
  beta:
    name: beta (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Deliberately NOT `-D warnings`, unlike every other job.
    #
    # This job exists to catch REAL breakage on the next toolchain: compile
    # errors, behaviour changes, test failures. New and tightened lints land in
    # beta constantly, and they frequently fire on macro-generated code we do
    # not own -- `clippy::double_must_use` fired inside `async_trait`'s own
    # expansion until async-trait 0.1.92 dropped the attribute, and the fix was
    # upstream's to make, not an `allow` on three of our traits.
    #
    # Inheriting the workflow-level `-D warnings` turned all of that into a red
    # X on every run. A job that is permanently red teaches everyone to ignore
    # it, so the one time beta catches something real, nobody looks. Warnings
    # still print in the log and are still worth reading; only genuine failures
    # colour the job.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all --all-features

  # Supply-chain gate: advisories, license policy, banned/duplicate crates, and
  # source allow-list. The weekly advisory re-scan lives in audit.yml
  # (advisories land after a PR merges, like RUSTSEC-2026-0007 in bytes did).
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # API docs build without warnings, so docs.rs never renders a broken link.
  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --no-deps --workspace

  # Secret scan of the tree, with the allowlist in .gitleaks.toml. The release
  # binary is pinned by version and SHA-256 rather than pulled through an
  # action.
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner .'
