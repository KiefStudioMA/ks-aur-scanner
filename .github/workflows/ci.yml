name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Lint + the full test suite (unit AND the CLI integration tests that run the
  # real binary against the PKGBUILD fixtures). This is the gate that catches the
  # "passes unit tests but breaks when you run it" class of bug.
  test:
    name: clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (unit + CLI integration)
        run: cargo test --all --all-features

      - name: Release build
        run: cargo build --all --release

  # Formatting is a hard gate. Applied repo-wide with `cargo fmt --all`.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Catch toolchain regressions early without blocking PRs.
  beta:
    name: beta (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Deliberately NOT `-D warnings`, unlike every other job.
    #
    # This job exists to catch REAL breakage on the next toolchain: compile
    # errors, behaviour changes, test failures. New and tightened lints land in
    # beta constantly, and they frequently fire on macro-generated code we do
    # not own -- `clippy::double_must_use` fires inside `async_trait`'s own
    # expansion, which we cannot fix and should not paper over with an `allow`
    # on three of our traits.
    #
    # Inheriting the workflow-level `-D warnings` turned all of that into a red
    # X on every run. A job that is permanently red teaches everyone to ignore
    # it, so the one time beta catches something real, nobody looks. Warnings
    # still print in the log and are still worth reading; only genuine failures
    # colour the job.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all --all-features

  # Supply-chain gate: advisories, license policy, banned/duplicate crates, and
  # source allow-list. Runs in CI and on a weekly schedule (advisories land
  # after a PR merges, like RUSTSEC-2026-0007 in bytes did).
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
