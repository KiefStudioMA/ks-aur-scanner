name: Security audit

# Advisories are published continuously, so re-scan the committed Cargo.lock on a
# schedule (not only on dependency changes) to catch a vuln in an existing,
# unchanged dependency.
on:
  schedule:
    - cron: '37 6 * * 1' # weekly, Monday 06:37 UTC
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
      - 'deny.toml'
  workflow_dispatch:

# The default token only needs to read the repository.
permissions:
  contents: read

jobs:
  audit:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
