# Dependency and Actions updates, batched weekly.
#
# cooldown: a release must be at least 7 days old before it is proposed, so a
# hijacked or broken release has time to be noticed and yanked first.
#
# Every update lands as a PR and needs a maintainer to re-sign its head before
# merging (see CONTRIBUTING.md); the aur-scanner-git package refuses to build
# a main that isn't traceable to release-key signatures.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Minor and patch updates are API-compatible, so they batch into one PR that
    # should pass CI as-is. Semver-major updates stay out of the group and open
    # one PR each, because each needs code changes and its own review.
    # sha2 0.11 needs Rust 1.88, above the workspace rust-version (1.85).
    # Drop this when the MSRV moves.
    ignore:
      - dependency-name: "sha2"
        versions: [">= 0.11"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # dtolnay/rust-toolchain publishes no release tags, so Dependabot proposes
    # whatever commit master points at that day and the cooldown cannot apply.
    # Bump that pin by hand to a master commit at least 7 days old.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
