#cloud-config
hostname: arch-aur-test
users:
  - name: tester
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    # Replace with YOUR public key (the contents of ~/.ssh/id_ed25519.pub or
    # similar). Whoever holds the matching private key gets passwordless sudo
    # in this VM.
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...REPLACE-WITH-YOUR-PUBLIC-KEY you@host

ssh_pwauth: false
disable_root: true

# Grow the root filesystem -- the cloud image ships small and a Rust release
# build of this workspace needs real room for target/.
growpart:
  mode: auto
  devices: ["/"]
resize_rootfs: true

runcmd:
  # Refresh keyring first: the shipped image can be weeks old and a stale
  # keyring makes every signed package fail to install.
  - [pacman-key, --init]
  - [pacman-key, --populate, archlinux]
  - [pacman, -Sy, --noconfirm, archlinux-keyring]
  - [pacman, -Syu, --noconfirm]
  # Every shell the project ships an integration or completion file for, so
  # those can be exercised in their real interpreter rather than assumed.
  - [pacman, -S, --noconfirm, --needed, base-devel, git, rust, clang, openssl, pacman-contrib, sudo, rsync, python, bash, zsh, fish, nushell, dash]
  - [touch, /tmp/cloud-init-done]

final_message: "arch-aur-test ready after $UPTIME seconds"
